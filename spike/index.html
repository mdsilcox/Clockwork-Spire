<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clockwork Spire spike</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b120a; color: #f0dcb4; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  #bar { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; align-items: center; background: #2a1c10; }
  #bar button, #bar select { background: #6b4a22; color: #f6e6c0; border: 1px solid #b88a44; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  #bar button.on { background: #b88a44; color: #2a1c10; }
  #stage { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  #readout { margin-left: auto; white-space: nowrap; }
  #fps { color: #9fe39f; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="run">Run turn</button>
    <button id="preview">Preview</button>
    <button id="reset">Reset</button>
    <span id="palette"></span>
    <button data-speed="1" class="on">1x</button><button data-speed="2">2x</button><button data-speed="0">Skip</button>
    <span id="readout"></span>
    <span id="fps">-- fps</span>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
