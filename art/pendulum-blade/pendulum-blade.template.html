<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendulum Blade</title>
<style>
  :root { --bg: #10393F; --panel: #1F6F6B; --brass: #C9A24A; --text: #f2e6cf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; padding: 8px; overflow-x: hidden; }
  .stage { position: relative; width: min(100%, 540px); aspect-ratio: 1416 / 1512; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  button { background: var(--panel); color: var(--text); border: 1px solid #5a4a2a; padding: 8px 16px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--brass); color: #1d2a30; border-color: var(--brass); }
  label { color: #b9a98c; display: flex; align-items: center; gap: 6px; padding: 8px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="bar">
  <button data-mood="idle" aria-pressed="true">Idle</button>
  <button data-mood="attack">Attack</button>
  <button data-mood="hurt">Hurt</button>
  <button data-mood="death">Death</button>
  <label><input type="checkbox" data-break="blade-edge"> Break edge</label>
  <label><input type="checkbox" data-break="blade-weight"> Break weight</label>
  <label><input type="checkbox" id="ball"> Break all</label>
  <label><input type="checkbox" id="mesh"> Mesh</label>
</div>
<script>__RIGJS__</script>
<script>
const { smooth, band, rad, rot } = Rig;
const IMG = "__IMG__";
const BKS = 1.5;
__KIT__

// Painting 896x1152, front view. The pendulum hangs from the hub gear at (445, 800); its swing is the attack. The base stands on two foot blocks at y ~1110.
const HUB = [445, 802], WHEEL = [445, 405], BASE = [445, 1100];
const BLADE = [[445, 805], [440, 900], [450, 1000], [455, 1140]];
const TIP = [452, 1110], EYE = [445, 405];
const blade = {
  size: [896, 1152], grid: [112, 144], pad: [260, 180],
  anchors: { "blade-edge": [452, 1070, 58], "blade-weight": [445, 802, 75], core: [445, 560, 90], eyes: [445, 405, 40] },
  weights(x, y) {
    const w = {};
    w.bl = (1 - smooth(36, 58, chainDist(x, y, BLADE).d)) * smooth(790, 830, y);
    const d = Math.hypot(x - WHEEL[0], y - WHEEL[1]);
    w.wh = smooth(150, 195, d) * smooth(770, 720, y);
    w.b = smooth(1090, 850, y);
    return w;
  },
  deform(x, y, w, P) {
    [x, y] = rot(x, y, ...HUB, rad(P.bl), w.bl);
    [x, y] = rot(x, y, ...WHEEL, rad(P.wh), w.wh);
    y = BASE[1] + (y - BASE[1]) * (1 + P.sq * w.b);
    [x, y] = rot(x, y, ...BASE, rad(P.roll), w.b);
    return [x + P.bx * w.b, y + P.by * w.b];
  },
  moods: { idle: { eye: 0.5 }, attack: { eye: 0.7 }, hurt: { eye: 0.5 }, death: { eye: 0.4 } },
  ease: 3,
  onMood(m, api) { const S = api.state; S.start = undefined; S.cycle = undefined; S.hit = undefined; S.did = {}; S.trail = []; },
  pose(L, t, dt, S, api) {
    if (S.start === undefined) { S.start = t; S.did = {}; S.next = {}; S.broken = S.broken || urlBroken(); }
    syncBroken(S, 896, 1152);
    const u = t - S.start, m = api.mood, bk = S.broken || {};
    const P = { roll: 0, bx: 0, by: 0, sq: 0, bl: 0, wh: 0, flash: 0, shake: null, eye: L.eye, dim: 0 };
    const once = (k, cond, fn) => { if (cond && !S.did[k]) { S.did[k] = true; fn(); } };
    const every = (k, period, from, fn) => { const n = Math.floor((u - from) / period); if (u >= from && S.next[k] !== n) { S.next[k] = n; fn(n); } };
    const ap = p => blade.deform(p[0], p[1], blade.weights(p[0], p[1]), P);
    if (m === "idle") {
      const c = u % 4, n = Math.floor(u / 4), ph = u * Math.PI * 2 / 2;
      // A clock at rest: the pendulum swings once every two seconds, the wheel advances in small ticks (a settle after each), the base barely shifts.
      P.bl = 24 * Math.sin(ph);
      const f = (u % 0.5) / 0.5, q8 = Math.round(2.4 * Math.sin(u * Math.PI / 2) / 0.8) * 0.8;     // the wheel moves in 0.8 degree ticks, each with a small settle
      P.wh = q8 + 0.35 * Math.sin(f * 40) * Math.exp(-f * 9);
      P.roll = 0.3 * Math.sin(ph * 0.5); P.by = 1.2 * Math.sin(ph);
      every("tick", 0.5, 0.0, kk => { if (kk % 2 === 0) { const q = ap(WHEEL); spawnWave(S, t, q[0], q[1], 40, 0.35, "#E3B84F"); } });
      P.eye = L.eye * (0.85 + 0.15 * Math.sin(u * 3.1)) * (c > 3.4 && c < 3.5 ? 0.15 : 1);
    } else if (m === "attack") {
      const c = u % 2.4, T = [0, 0.25, 0.8, 0.96, 1.06, 1.5, 2.4];
      // The pendulum draws back to the right, the wheel winds, then the pendulum whips left and the whole frame leans after it.
      P.bl = kf(c, T, [0, -6, -34, 44, 30, -6, 0]); P.wh = kf(c, T, [0, -3, -10, 8, 4, 0, 0]);
      P.roll = kf(c, T, [0, 0.5, 1.6, -2.4, -1.4, -0.3, 0]); P.bx = kf(c, T, [0, 2, 8, -14, -8, -2, 0]); P.by = kf(c, T, [0, 2, 3, 0, 2, 0, 0]); P.sq = kf(c, T, [0, 0.004, 0.008, -0.006, 0.003, 0, 0]);
      P.eye = kf(c, [0, 0.8, 1.0, 1.4, 2.4], [0.7, 1.4, 1.5, 0.8, 0.7]);
      const cyc = Math.floor(u / 2.4);
      if (S.cycle !== cyc) { S.cycle = cyc; S.did = {}; }
      for (const [k, t0] of [["w1", 0.3], ["w2", 0.55]]) once(k, c > t0, () => { const q = ap(WHEEL); spawnWave(S, t, q[0], q[1], 60, 0.45, "#E3B84F"); });
      if (c > 0.86 && c < 1.14) { const q = ap(TIP), tr = S.trail = S.trail || [], l = tr[tr.length - 1]; if (!l || Math.hypot(q[0] - l[0], q[1] - l[1]) > 24) tr.push(q); }
      once("smear", c >= 1.14, () => { if (S.trail && S.trail.length > 2) spawnSmear(S, t, S.trail.slice(-8), 60); S.trail = []; });
      once("cut", c >= 0.98, () => { const q = ap(TIP); spawnStar(S, t, q[0] - 20, q[1] - 10, 70); spawnSpark(S, t, q[0] - 20, q[1], 9, 600); spawnRing(S, t, 300, 1125, 150, 0.55); spawnWave(S, t, 445, 802, 150, 0.6); });
      if (c >= 0.98) { const d = Math.exp(-(c - 0.98) * 9); P.shake = [(Math.random() - 0.5) * 12 * d, (Math.random() - 0.5) * 8 * d]; }
    } else if (m === "hurt") {
      const c = u % 1.5, T = [0, 0.07, 0.2, 0.7, 1.5];
      P.flash = flashK(c);
      P.bx = kf(c, T, [0, 24, 18, 0, 0]); P.by = kf(c, T, [0, -4, -2, 0, 0]); P.roll = kf(c, T, [0, 2, 1.2, 0, 0]);
      P.bl = kf(c, T, [0, -26, 14, -4, 0]); P.wh = kf(c, T, [0, 7, -3, 0, 0]);
      P.eye = kf(c, [0, 0.07, 0.3, 1.5], [0.5, 1.6, 0.3, 0.5]);
      const d = Math.exp(-c * 6); P.shake = [(Math.random() - 0.5) * 9 * d, (Math.random() - 0.5) * 6 * d];
      const cyc = Math.floor(u / 1.5);
      if (S.hit !== cyc) { S.hit = cyc; spawnStar(S, t, 445, 560, 74); spawnSpark(S, t, 445, 560, 7, 450); spawnWave(S, t, 445, 405, 90, 0.5, "#E3B84F"); }
    } else if (m === "death") {
      const c = Math.min(u, 2.999), T = [0, 0.08, 0.35, 1.0, 1.8, 2.5, 3];
      P.flash = flashK(c);
      P.bx = kf(c, T, [0, 20, 12, 12, 40, 60, 60]); P.roll = kf(c, T, [0, 1.5, 1, 2.5, 9, 11, 11]); P.by = kf(c, T, [0, -3, 0, 10, 60, 78, 78]);
      P.sq = kf(c, T, [0, 0, 0, -0.01, -0.09, -0.12, -0.12]);
      P.bl = kf(c, T, [0, -20, 10, -14, 34, 26, 26]); P.wh = kf(c, T, [0, 6, -2, 4, -16, -22, -22]);
      if (c > 0.35 && c < 1.0) { P.roll += 0.5 * Math.sin(c * 50) * (1 - (c - 0.35) / 0.65); P.by += 1.5 * Math.sin(c * 43); P.wh += 2 * Math.sin(c * 37); }
      P.eye = c < 0.3 ? 1.4 : c < 1.8 ? 0.45 * (Math.sin(c * 31) > 0.2 ? 1 : 0.25) * (1 - (c - 0.3) / 1.5) : 0;
      P.dim = ease(clamp((c - 1.0) / 1.0));
      if (c > 0.1 && c < 1.0) { const d = Math.exp(-(c - 0.1) * 4); P.shake = [(Math.random() - 0.5) * 12 * d, (Math.random() - 0.5) * 8 * d]; }
      once("hit", c < 0.2, () => { spawnStar(S, t, 445, 560, 80); spawnSpark(S, t, 445, 560, 9, 500); });
      once("k1", c >= 1.5, () => { spawnRing(S, t, 300, 1125, 170, 0.6); spawnShards(S, t, 260, 1110, 7, 80); spawnShards(S, t, 650, 1110, 7, 80); });
      once("k2", c >= 2.2, () => { spawnRing(S, t, 450, 1130, 230, 0.7); spawnWave(S, t, 445, 802, 120, 0.7, "#E3B84F"); });
      every("sp", 0.4, 0.9, () => { if (c < 2.5) spawnSpark(S, t, 380 + Math.random() * 120, 560 + Math.random() * 100, 3, 300); });
    }
    if (bk["blade-edge"] && m !== "death") every("le", 0.4, 0.1, () => { const q = ap([452, 1030]); spawnSpark(S, t, q[0], q[1], 2, 160); });
    if (bk["blade-weight"]) every("lw", 0.4, 0.2, () => { const q = ap([445, 830]); spawnSpark(S, t, q[0], q[1], 2, 160); });
    P.t = t;
    return P;
  },
  over(c, P, t, api) {
    const S = api.state, at = p => api.point(p[0], p[1], P);
    // Eye: the wheel's hub gets a small ember; it goes dark in death.
    const E = Math.max(0, P.eye), ep = at(EYE);
    if (E > 0.9) ember(c, ep[0], ep[1], 7 + 7 * Math.min(1, E - 0.9), 0.95);
    if (P.dim > 0) { c.globalAlpha = 0.8 * P.dim; c.fillStyle = INK; c.beginPath(); c.arc(ep[0], ep[1], 34, 0, 2 * Math.PI); c.fill(); c.globalAlpha = 1; }
    drawFx(c, S, t);
    drawBroken(c, at, S, t);
  },
};
const DMG = {
  // The blade: the tip is snapped off in a jagged bite, ember in the break, cracks up the blade.
  "blade-edge": { poly: jaggedBlob(452, 1075, 100, 14, 0.5, 5), c: [440, 1000], r: 20, cracks: 3, crack0: -1.7, crackStep: 0.7, seed: 81, ember: [[452, 1060, 14], [425, 1040, 8], [470, 1085, 8]] },
  // The counterweight gear at the hub: a chunk blown out of it.
  "blade-weight": { poly: jaggedBlob(440, 795, 80, 13, 0.5, 9), c: [440, 795], r: 20, cracks: 4, crack0: 0.2, crackStep: 1.5, seed: 83, ember: [[440, 800, 14], [412, 778, 8], [470, 818, 8]] },
};
const rig = Rig.mount(document.getElementById("stage"), blade, IMG);
wire(rig);
</script>
</body>
</html>
