<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo Sprite</title>
<style>
  :root { --bg: #10393F; --panel: #1F6F6B; --brass: #C9A24A; --text: #f2e6cf; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; padding: 8px; overflow-x: hidden; }
  .stage { position: relative; width: min(100%, 800px); aspect-ratio: 2096 / 1492; }
  #flip, #rig { position: absolute; inset: 0; }
  #flip { transform: scaleX(-1); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  button { background: var(--panel); color: var(--text); border: 1px solid #5a4a2a; padding: 8px 16px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--brass); color: #1d2a30; border-color: var(--brass); }
  label { color: #b9a98c; display: flex; align-items: center; gap: 6px; padding: 8px; }
</style>
</head>
<body>
<div class="stage" id="stage"><div id="flip"><div id="rig"></div></div></div>
<div class="bar">
  <button data-mood="idle" aria-pressed="true">Idle</button>
  <button data-mood="attack">Attack</button>
  <button data-mood="hurt">Hurt</button>
  <button data-mood="death">Death</button>
  <label><input type="checkbox" data-break="sprite-mouth"> Break mouth</label>
  <label><input type="checkbox" data-break="sprite-fin"> Break fin</label>
  <label><input type="checkbox" id="ball"> Break all</label>
  <label><input type="checkbox" id="mesh"> Mesh</label>
</div>
<script>__RIGJS__</script>
<script>
const { smooth, band, rad, rot } = Rig;
const IMG = "__IMG__";
const BKS = 1.4;
__KIT__

// Painting 1216x832 faces RIGHT (nose at x 1130); the page mirrors it (#flip) so the sprite faces left. It floats: no feet, no ground.
const NOSEP = [770, 250], FINP = [185, 430], MID = [640, 430];
const NOSE = [1050, 235], FIN = [105, 425], EYE = [627, 292];
const sprite = {
  size: [1216, 832], grid: [152, 104], pad: [440, 330],
  anchors: { "sprite-mouth": [1040, 240, 95], "sprite-fin": [105, 425, 70], core: [520, 470, 95], eyes: [627, 292, 40] },
  weights(x, y) {
    const w = {};
    w.nose = smooth(735, 800, x) * smooth(400, 340, y);
    w.fin = smooth(185, 120, x) * band(y, 375, 475, 15);
    w.cr = smooth(690, 740, x) * smooth(440, 520, y) * smooth(900, 850, x);          // right dangling cables
    w.cl = smooth(265, 215, x) * smooth(570, 620, y);                                 // left dangling cable
    return w;
  },
  deform(x, y, w, P) {
    x += P.cab * w.cr * Math.pow(Math.max(0, (y - 440) / 250), 1.3) + P.cab2 * w.cr * Math.sin((y - 440) / 250 * Math.PI);
    x += P.cabl * w.cl * Math.pow(Math.max(0, (y - 570) / 100), 1.2);
    [x, y] = rot(x, y, ...FINP, rad(P.fin), w.fin);
    [x, y] = rot(x, y, ...NOSEP, rad(P.nose), w.nose); x += P.nx * w.nose;
    [x, y] = rot(x, y, ...MID, rad(P.tilt), 1);
    return [x + P.bx, y + P.by];
  },
  moods: { idle: { eye: 0.5 }, attack: { eye: 0.7 }, hurt: { eye: 0.5 }, death: { eye: 0.4 } },
  ease: 3,
  onMood(m, api) { const S = api.state; S.start = undefined; S.cycle = undefined; S.hit = undefined; S.did = {}; S.trail = []; },
  pose(L, t, dt, S, api) {
    if (S.start === undefined) { S.start = t; S.did = {}; S.next = {}; S.broken = S.broken || urlBroken(); }
    syncBroken(S, 1216, 832);
    const u = t - S.start, m = api.mood, bk = S.broken || {};
    const P = { bx: 0, by: 0, tilt: 0, nose: 0, nx: 0, fin: 0, cab: 0, cab2: 0, cabl: 0, flash: 0, shake: null, eye: L.eye, dim: 0 };
    const once = (k, cond, fn) => { if (cond && !S.did[k]) { S.did[k] = true; fn(); } };
    const every = (k, period, from, fn) => { const n = Math.floor((u - from) / period); if (u >= from && S.next[k] !== n) { S.next[k] = n; fn(n); } };
    const ap = p => sprite.deform(p[0], p[1], sprite.weights(p[0], p[1]), P);
    if (m === "idle") {
      const c = u % 4, n = Math.floor(u / 4), ph = u * Math.PI * 2 / 4;
      // A slow float: the hull rises and sinks, tips a little, the cables lag, the tail fin wags, the nose twitches once and rings an echo.
      P.by = 11 * Math.sin(ph); P.bx = 8 * Math.sin(ph * 0.5 + 0.3); P.tilt = 1.5 * Math.sin(ph - 0.9);
      P.cab = 16 * Math.sin(ph - 1.4); P.cab2 = 6 * Math.sin(ph * 2 - 0.4); P.cabl = 10 * Math.sin(ph - 1.0);
      P.fin = 8 * Math.sin(ph * 2 - 0.5);
      P.nose = c > 1.8 && c < 2.3 ? 4 * Math.sin((c - 1.8) / 0.5 * Math.PI) : 0.6 * Math.sin(ph);
      once("echo" + n, c > 1.9, () => { const q = ap(NOSE); spawnWave(S, t, q[0] + 20, q[1], 100, 0.7, "#5FD0C8"); });
      P.eye = L.eye * (0.85 + 0.15 * Math.sin(u * 3.1)) * (c > 3.3 && c < 3.4 ? 0.15 : 1);
    } else if (m === "attack") {
      const c = u % 2.4, T = [0, 0.25, 0.8, 0.96, 1.06, 1.5, 2.4];
      // Draws back and tips its nose up, then thrusts forward with a shout of rings.
      P.bx = kf(c, T, [0, -14, -80, 185, 140, 18, 0]); P.by = kf(c, T, [0, 6, 22, -4, 6, 2, 0]); P.tilt = kf(c, T, [0, -3, -13, 11, 7, 1, 0]);
      P.nose = kf(c, T, [0, 2, -9, 5, 3, 0, 0]); P.nx = kf(c, T, [0, -4, -16, 40, 24, 0, 0]); P.fin = kf(c, T, [0, 4, 14, -16, -8, 0, 0]);
      P.cab = kf(c, T, [0, 8, 30, -34, -14, 4, 0]); P.cab2 = kf(c, T, [0, 0, -8, 10, 4, 0, 0]); P.cabl = kf(c, T, [0, 6, 22, -22, -8, 0, 0]);
      P.eye = kf(c, [0, 0.8, 1.0, 1.4, 2.4], [0.7, 1.4, 1.5, 0.8, 0.7]);
      const cyc = Math.floor(u / 2.4);
      if (S.cycle !== cyc) { S.cycle = cyc; S.did = {}; }
      for (const [k, t0] of [["w1", 0.35], ["w2", 0.6]]) once(k, c > t0, () => { const q = ap(NOSE); spawnWave(S, t, q[0], q[1], 70, 0.45, "#5FD0C8"); });
      if (c > 0.88 && c < 1.14) { const q = ap([1100, 240]), tr = S.trail = S.trail || [], l = tr[tr.length - 1]; if (!l || Math.hypot(q[0] - l[0], q[1] - l[1]) > 24) tr.push(q); }
      once("smear", c >= 1.14, () => { if (S.trail && S.trail.length > 2) spawnSmear(S, t, S.trail.slice(-8), 60); S.trail = []; });
      once("shout", c >= 0.98, () => { const q = ap([1130, 235]); spawnStar(S, t, q[0] + 30, q[1], 66); for (const [r, l, col] of [[240, 0.75, "#5FD0C8"], [160, 0.6, CREAM], [320, 0.9, "#5FD0C8"]]) spawnWave(S, t, q[0] + 20, q[1], r, l, col); spawnSpark(S, t, q[0], q[1], 7, 560); });
      if (c >= 0.98) { const d = Math.exp(-(c - 0.98) * 9); P.shake = [(Math.random() - 0.5) * 12 * d, (Math.random() - 0.5) * 8 * d]; }
    } else if (m === "hurt") {
      const c = u % 1.5, T = [0, 0.07, 0.2, 0.7, 1.5];
      P.flash = flashK(c);
      P.bx = kf(c, T, [0, -42, -32, 0, 0]); P.by = kf(c, T, [0, -8, -3, 0, 0]); P.tilt = kf(c, T, [0, -9, -4, 0, 0]);
      P.nose = kf(c, T, [0, -8, -3, 0, 0]); P.fin = kf(c, T, [0, 16, -6, 0, 0]); P.cab = kf(c, T, [0, 26, -12, 3, 0]); P.cabl = kf(c, T, [0, 16, -8, 0, 0]);
      P.eye = kf(c, [0, 0.07, 0.3, 1.5], [0.5, 1.6, 0.3, 0.5]);
      const d = Math.exp(-c * 6); P.shake = [(Math.random() - 0.5) * 9 * d, (Math.random() - 0.5) * 6 * d];
      const cyc = Math.floor(u / 1.5);
      if (S.hit !== cyc) { S.hit = cyc; spawnStar(S, t, 560, 330, 74); spawnSpark(S, t, 560, 330, 7, 450); spawnWave(S, t, 627, 292, 90, 0.5, "#5FD0C8"); }
    } else if (m === "death") {
      const c = Math.min(u, 2.999), T = [0, 0.08, 0.35, 1.0, 1.7, 2.2, 3];
      P.flash = flashK(c);
      P.bx = kf(c, T, [0, -30, -20, -10, 10, 24, 24]); P.by = kf(c, T, [0, -6, 0, 18, 250, 296, 296]);
      P.tilt = kf(c, T, [0, -8, -4, 6, 16, 12, 12]); P.nose = kf(c, T, [0, -8, -4, 6, 14, 10, 10]);
      P.cab = kf(c, T, [0, 20, 6, 22, 40, 20, 20]); P.cabl = kf(c, T, [0, 10, 4, 14, 30, 14, 14]); P.fin = kf(c, T, [0, 16, 8, 20, 30, 20, 20]);
      if (c > 0.35 && c < 1.0) { P.tilt += 1.2 * Math.sin(c * 50) * (1 - (c - 0.35) / 0.65); P.by += 2 * Math.sin(c * 43); }
      P.eye = c < 0.3 ? 1.4 : c < 1.8 ? 0.45 * (Math.sin(c * 31) > 0.2 ? 1 : 0.25) * (1 - (c - 0.3) / 1.5) : 0;
      P.dim = ease(clamp((c - 1.0) / 1.0));
      if (c > 0.1 && c < 1.0) { const d = Math.exp(-(c - 0.1) * 4); P.shake = [(Math.random() - 0.5) * 12 * d, (Math.random() - 0.5) * 8 * d]; }
      once("hit", c < 0.2, () => { spawnStar(S, t, 560, 330, 80); spawnSpark(S, t, 560, 330, 9, 500); });
      once("w", c >= 0.9, () => { const q = ap(NOSE); spawnWave(S, t, q[0], q[1], 80, 0.6, "#5FD0C8"); });
      every("sp", 0.35, 0.8, () => { if (c < 1.8) spawnSpark(S, t, 400 + Math.random() * 300, 500 + Math.random() * 150 + P.by, 3, 300); });
      once("land", c >= 1.72, () => { spawnRing(S, t, 640, 1090, 330, 0.7); spawnRing(S, t, 640, 1100, 200, 0.6); spawnShards(S, t, 420, 1090, 8, 100); spawnShards(S, t, 860, 1090, 8, 100); spawnShards(S, t, 640, 1090, 6, 100); });
      once("land2", c >= 2.2, () => { spawnRing(S, t, 640, 1100, 380, 0.8); spawnWave(S, t, 627, 590, 120, 0.8, "#5FD0C8"); });
    }
    if (bk["sprite-mouth"] && m !== "death") every("lm", 0.4, 0.1, () => { const q = ap([1000, 300]); spawnSpark(S, t, q[0], q[1], 2, 160); });
    if (bk["sprite-fin"]) every("lf", 0.4, 0.2, () => { const q = ap([120, 440]); spawnSpark(S, t, q[0], q[1], 2, 160); });
    P.t = t;
    return P;
  },
  over(c, P, t, api) {
    const S = api.state, at = p => api.point(p[0], p[1], P);
    // Eye: the round porthole; a small ember flares in it in attack and hurt and it goes dark in death.
    const E = Math.max(0, P.eye), ep = at(EYE);
    if (E > 0.9) ember(c, ep[0], ep[1], 6 + 6 * Math.min(1, E - 0.9), 0.95);
    if (P.dim > 0) { c.globalAlpha = 0.85 * P.dim; c.fillStyle = INK; c.beginPath(); c.arc(ep[0], ep[1], 24, 0, 2 * Math.PI); c.fill(); c.globalAlpha = 1; }
    drawFx(c, S, t);
    drawBroken(c, at, S, t);
  },
};
const DMG = {
  // The nose: the cone's tip is blown off in a jagged bite, ember inside, cracks back along the brass.
  "sprite-mouth": { poly: jaggedBlob(1060, 240, 125, 14, 0.5, 5), c: [990, 235], r: 30, cracks: 5, crack0: 2.4, crackStep: 0.9, seed: 71, ember: [[1048, 240, 16], [1008, 222, 9], [1070, 262, 9]] },
  // The tail fin: snapped off, jagged stump.
  "sprite-fin": { poly: jaggedBlob(100, 425, 95, 12, 0.5, 8), c: [175, 430], r: 30, cracks: 3, crack0: -0.5, crackStep: 1.4, seed: 73, ember: [[110, 428, 14], [138, 410, 8], [90, 448, 8]] },
};
const rig = Rig.mount(document.getElementById("rig"), sprite, IMG);
wire(rig);
</script>
</body>
</html>
