<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprocket</title>
<style>
  :root { --bg: #10393F; --panel: #1F6F6B; --brass: #C9A24A; --text: #E8EEF0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-x: hidden; }
  .stage { position: relative; width: min(100%, 760px); aspect-ratio: 1296 / 892; background: var(--bg); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--brass); padding: 8px 16px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--brass); color: #14100C; }
  label { display: flex; align-items: center; gap: 6px; padding: 8px; }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="bar">
  <button data-mood="idle" aria-pressed="true">Idle</button>
  <button data-mood="happy">Happy</button>
  <button data-mood="sleepy">Sleepy</button>
  <button data-mood="walk">Walk</button>
  <label><input type="checkbox" id="mesh"> Mesh</label>
</div>
<script>// Reusable mesh rig: one painting on a WebGL grid, bent by a character's deform function.
// A character supplies: size [W, H], grid [GX, GY], weights(x, y), deform(x, y, w, P),
// pad [px, py] (margin around the painting), part(x, y) -> id and tear(x, y) -> bool (drop triangles that
// straddle two parts where tear() says the parts are separate objects, such as an arm hanging beside a leg), moods {name: targets}, pose(live, t, dt, state) -> P, optional under/over(ctx, P, t, api) for code effects, and optional anchors {id: [x, y, r]} (image pixels)
// for breakable parts and effect points, read back with api.anchor(id). Project copy: edit only with a decision.
window.Rig = {
  smooth(a, b, v) { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); },
  band(x, x0, x1, soft) { return Rig.smooth(x0 - soft, x0 + soft, x) * Rig.smooth(x1 + soft, x1 - soft, x); },
  rad(d) { return d * Math.PI / 180; },
  rot(x, y, px, py, a, w) {
    if (!w || !a) return [x, y];
    const c = Math.cos(a), s = Math.sin(a), dx = x - px, dy = y - py;
    return [x + w * (px + dx * c - dy * s - x), y + w * (py + dx * s + dy * c - y)];
  },

  mount(stage, ch, imgSrc) {
    const [W, H] = ch.size, [GX, GY] = ch.grid, [PX, PY] = ch.pad || [0, 0], WW = W + 2 * PX, WH = H + 2 * PY;
    const mk = () => { const c = document.createElement("canvas"); stage.appendChild(c); return c; };
    const under = mk(), glc = mk(), over = mk();
    const gl = glc.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: true });
    const uctx = under.getContext("2d"), octx = over.getContext("2d");
    const api = {
      mood: Object.keys(ch.moods)[0], live: {}, state: {}, frozen: false, showMesh: false, flash: 0,
      setMood(m) { api.mood = m; api.frozen = false; ch.onMood && ch.onMood(m, api); },
      point(x, y, P) { return ch.deform(x, y, ch.weights(x, y), P); },
      // Where an image-pixel point is now, in CSS pixels relative to the stage (uses the last drawn pose).
      anchorAt(x, y) {
        const P = api.lastP; if (!P) return null;
        const [dx, dy] = ch.deform(x, y, ch.weights(x, y), P), r = stage.getBoundingClientRect();
        return [(dx + PX) / WW * r.width, (dy + PY) / WH * r.height];
      },
      // A named anchor from ch.anchors {id: [x, y, r]}: [cssX, cssY, cssRadius] or null.
      anchor(id) {
        const a = ch.anchors && ch.anchors[id]; if (!a) return null;
        const p = api.anchorAt(a[0], a[1]); if (!p) return null;
        return [p[0], p[1], a[2] / WW * stage.getBoundingClientRect().width];
      },
    };
    Object.assign(api.live, ch.moods[api.mood]);
    let rest, verts, wts, idx, posBuf, uMesh, uFlash;

    function size() {
      const dpr = Math.min(2, window.devicePixelRatio || 1), r = stage.getBoundingClientRect();
      for (const c of [glc, under, over]) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
      gl.viewport(0, 0, glc.width, glc.height);
    }
    function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    function setup(img) {
      const p = gl.createProgram();
      gl.attachShader(p, sh(gl.VERTEX_SHADER, `attribute vec2 a_pos; attribute vec2 a_uv; varying vec2 v_uv;
        void main(){ v_uv=a_uv; vec2 c=(a_pos+vec2(${PX}.0,${PY}.0))/vec2(${WW}.0,${WH}.0)*2.0-1.0; gl_Position=vec4(c.x,-c.y,0.0,1.0); }`));
      gl.attachShader(p, sh(gl.FRAGMENT_SHADER, `precision mediump float; varying vec2 v_uv; uniform sampler2D t;
        uniform float u_mesh; uniform float u_flash;
        void main(){ vec4 c=texture2D(t,v_uv); c.rgb=mix(c.rgb,vec3(c.a),u_flash);
          gl_FragColor = u_mesh>0.5 ? vec4(0.95,0.8,0.3,1.0) : c; }`));
      gl.linkProgram(p); gl.useProgram(p);
      const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
      const n = (GX + 1) * (GY + 1); rest = new Float32Array(n * 2); verts = new Float32Array(n * 2); const uv = new Float32Array(n * 2); wts = [];
      for (let j = 0; j <= GY; j++) for (let i = 0; i <= GX; i++) {
        const k = j * (GX + 1) + i, x = i / GX * W, y = j / GY * H;
        rest[2 * k] = x; rest[2 * k + 1] = y; uv[2 * k] = i / GX; uv[2 * k + 1] = j / GY; wts.push(ch.weights(x, y));
      }
      const tri = [], lines = [];
      for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) {
        const a = j * (GX + 1) + i, b = a + 1, c = a + GX + 1, d = c + 1; lines.push(a, b, a, c);
        if (ch.part && ch.tear) {
          const ids = [a, b, c, d].map(v => ch.part(rest[2 * v], rest[2 * v + 1]));
          const cx = (i + 0.5) / GX * W, cy = (j + 0.5) / GY * H;
          if (ids.some(v => v !== ids[0]) && ch.tear(cx, cy)) continue;
        }
        tri.push(a, b, c, b, d, c);
      }
      idx = { tri: new Uint16Array(tri), lines: new Uint16Array(lines) };
      idx.triBuf = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx.triBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx.tri, gl.STATIC_DRAW);
      idx.lineBuf = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx.lineBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx.lines, gl.STATIC_DRAW);
      const uvBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf); gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
      const aUv = gl.getAttribLocation(p, "a_uv"); gl.enableVertexAttribArray(aUv); gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);
      posBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
      const aPos = gl.getAttribLocation(p, "a_pos"); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      uMesh = gl.getUniformLocation(p, "u_mesh"); uFlash = gl.getUniformLocation(p, "u_flash");
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    }

    function step(dt, t) {
      const target = ch.moods[api.mood], ease = 1 - Math.exp(-dt * (ch.ease || 3));
      for (const k in target) api.live[k] += (target[k] - api.live[k]) * ease;
      return ch.pose(api.live, t, dt, api.state, api);
    }
    function draw(P, t) {
      api.lastP = P;
      for (let k = 0; k < wts.length; k++) {
        const [x, y] = ch.deform(rest[2 * k], rest[2 * k + 1], wts[k], P); verts[2 * k] = x; verts[2 * k + 1] = y;
      }
      gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts);
      gl.uniform1f(uFlash, P.flash || 0); gl.uniform1f(uMesh, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx.triBuf); gl.drawElements(gl.TRIANGLES, idx.tri.length, gl.UNSIGNED_SHORT, 0);
      if (api.showMesh) { gl.uniform1f(uMesh, 1); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idx.lineBuf); gl.drawElements(gl.LINES, idx.lines.length, gl.UNSIGNED_SHORT, 0); }
      const sx = under.width / WW, sy = under.height / WH;
      for (const [c, f] of [[uctx, ch.under], [octx, ch.over]]) {
        c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, under.width, under.height); c.setTransform(sx, 0, 0, sy, PX * sx, PY * sy);
        if (f) { c.save(); f(c, P, t, api); c.restore(); }
      }
      // Screen shake moves the whole stage.
      stage.style.transform = P.shake ? `translate(${P.shake[0]}px, ${P.shake[1]}px)` : "";
    }

    let last = performance.now(), t0 = last;
    api.reset = m => { api.mood = m; api.live = { ...ch.moods[m] }; api.state = {}; ch.onMood && ch.onMood(m, api); };
    api.seq = m => { api.frozen = true; api.reset(m); let t = 0; return { next(dt) { t += dt; draw(step(dt, t), t); } }; };
    const img = new Image();
    img.onload = () => {
      size(); setup(img); api.ready = true; window.addEventListener("resize", size);
      requestAnimationFrame(function loop(now) {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        if (!api.frozen) { const t = (now - t0) / 1000; draw(step(dt, t), t); }
        requestAnimationFrame(loop);
      });
    };
    img.src = imgSrc;
    return api;
  },
};
</script>
<script>
const { smooth, band, rad, rot } = Rig;
const EYE = { x: 193, y: 240, rx: 17, ry: 18, rot: -0.2 };
const GROUND = 752;
const FEETPT = [[575, 750], [485, 750], [790, 750], [1045, 752]];   // far front, near front, far hind, near hind
const INK = "#14100C";

// Legs: 0 far front, 1 near front, 2 far hind, 3 near hind. x1 of the near front and x0 of the far front follow bx(y).
const bx = y => 565 - 42 * smooth(660, 715, y);
const LEG = [
  { x0: 520, x1: 650, soft: 5, r0: 600, r1: 650, up: [570, 590], k0: 660, k1: 710, kp: [575, 690] },
  { x0: 425, x1: 567, soft: 5, r0: 575, r1: 635, up: [505, 570], k0: 650, k1: 700, kp: [495, 680] },
  { x0: 740, x1: 930, soft: 10, r0: 585, r1: 640, up: [880, 560], k0: 640, k1: 690, kp: [895, 655] },
  { x0: 1000, x1: 1110, soft: 8, r0: 610, r1: 660, up: [1050, 620], k0: 690, k1: 725, kp: [1050, 705] },
];
const TAIL_P = [1040, 340];

function legId(x, y) { return x < bx(y) ? 1 : x < 700 ? 0 : x < 940 ? 2 : 3; }

const sprocket = {
  size: [1216, 832], grid: [114, 78], pad: [40, 30],
  weights(x, y) {
    const w = {
      earF: band(x, 222, 262, 6) * smooth(185, 135, y),
      earN: band(x, 262, 350, 10) * smooth(245, 175, y),
      head: smooth(440, 340, x) * smooth(450, 380, y),
      tail: smooth(980, 1030, x) * smooth(400, 310, y),
      rear: smooth(600, 820, x),
      low: smooth(548, 600, y),
      chest: smooth(565, 430, y),
      grd: smooth(640, 745, y),
    };
    const bxy = bx(y), bnd = LEG.map((l, i) => i === 0 ? band(x, bxy, l.x1, 12) : i === 1 ? band(x, l.x0, bxy, 12) : band(x, l.x0, l.x1, l.soft));
    w.legU = LEG.map((l, i) => bnd[i] * smooth(l.r0, l.r1, y));
    w.legL = LEG.map((l, i) => bnd[i] * smooth(l.k0, l.k1, y));
    return w;
  },
  // Near and far legs overlap: tear the mesh along their boundaries below the belly.
  // Front legs overlap in the painting: they blend softly (a tear would leave a stair-stepped edge); the hind legs are torn apart across the gap.
  part(x, y) { return y < 585 ? 0 : x < 700 ? 1 : x < 940 ? 2 : 3; },
  tear(x, y) { return y > 650; },
  deform(x, y, w, P) {
    [x, y] = rot(x, y, 245, 165, rad(P.earF), w.earF);
    [x, y] = rot(x, y, 305, 205, rad(P.earN), w.earN);
    if (w.tail) {
      const d = Math.hypot(x - TAIL_P[0], y - TAIL_P[1]), a = rad(P.tail) * smooth(40, 300, d);
      [x, y] = rot(x, y, TAIL_P[0], TAIL_P[1], a, w.tail);
    }
    for (let i = 0; i < 4; i++) {
      const l = LEG[i];
      [x, y] = rot(x, y, l.kp[0], l.kp[1], rad(P.legK[i]), w.legL[i]);
      y -= P.legLift[i] * w.legL[i];
      [x, y] = rot(x, y, l.up[0], l.up[1], rad(P.legA[i]), w.legU[i]);
    }
    [x, y] = rot(x, y, 345, 305, rad(P.head), w.head);
    x += P.wiggle * w.rear * (1 - w.grd);
    const k = 1 - 0.36 * P.crouch, drop = (GROUND - 560) * (1 - k);
    const yc = GROUND - (GROUND - y) * k;
    y = y + (yc - y) * w.low + drop * (1 - w.low);
    y = 560 + drop - (560 + drop - y) * (1 + P.breath * w.chest * (1 - w.low));
    y -= (P.hop + P.bob) * (1 - w.grd);
    return [x, y];
  },
  moods: {
    idle:   { tailAmp: 8,  tailHz: 0.5, tailBase: 0,  head: 0,   ear: 0,  crouch: 0,    breath: 0.02, breathHz: 0.25, hop: 0,  wiggle: 0, tap: 0, eyes: 0, walk: 0, mouth: 0, z: 0 },
    happy:  { tailAmp: 14, tailHz: 6,   tailBase: -4, head: 8,   ear: -4, crouch: 0,    breath: 0.022, breathHz: 1,    hop: 14, wiggle: 12, tap: 5, eyes: 0, walk: 0, mouth: 1, z: 0 },
    sleepy: { tailAmp: 2,  tailHz: 0.2, tailBase: 22, head: -16, ear: 16, crouch: 0.22, breath: 0.036, breathHz: 0.2,  hop: 0,  wiggle: 0, tap: 0, eyes: 1, walk: 0, mouth: 0, z: 1 },
    walk:   { tailAmp: 9,  tailHz: 3,   tailBase: -4, head: 0,   ear: 0,  crouch: 0,    breath: 0.012, breathHz: 1.5,  hop: 0,  wiggle: 0, tap: 0, eyes: 0, walk: 1, mouth: 0, z: 0 },
  },
  onMood(m, api) { api.state = { start: undefined }; },
  pose(L, t, dt, S, api) {
    if (S.start === undefined) { S.start = t; S.p = { tail: 0, breath: 0, hop: 0, wig: 0, tap: 0, walk: 0 }; S.dust = []; S.prev = [0, 0, 0, 0]; }
    const p = S.p, TAU = 2 * Math.PI, u = t - S.start, m = api.mood;
    p.tail += dt * L.tailHz * TAU; p.breath += dt * L.breathHz * TAU;
    p.hop += dt * 2 * TAU; p.wig += dt * 4 * TAU; p.tap += dt * 2 * TAU;
    p.walk += dt * 1.5 * TAU * L.walk;
    const bump = (a, b) => (u >= a && u < b) ? Math.sin(Math.PI * (u - a) / (b - a)) : 0;
    const c4 = u % 4;
    let blink = 0, flickN = 0, flickF = 0, eyes = L.eyes, headX = 0;
    if (m === "idle") {
      blink = Math.max(bump(1.6, 1.78) * 0 + ((c4 >= 1.6 && c4 < 1.78) ? Math.sin(Math.PI * (c4 - 1.6) / 0.18) : 0),
                       (c4 >= 3.3 && c4 < 3.48) ? Math.sin(Math.PI * (c4 - 3.3) / 0.18) : 0);
      flickN = (c4 >= 1 && c4 < 1.35) ? Math.sin(Math.PI * (c4 - 1) / 0.35) * 12 : 0;
      flickF = (c4 >= 2.6 && c4 < 2.95) ? Math.sin(Math.PI * (c4 - 2.6) / 0.35) * 14 : 0;
    } else if (m === "happy") {
      const c3 = u % 3;
      blink = (c3 >= 1.9 && c3 < 2.08) ? Math.sin(Math.PI * (c3 - 1.9) / 0.18) : 0;
      flickF = (c3 >= 0.6 && c3 < 0.9) ? Math.sin(Math.PI * (c3 - 0.6) / 0.3) * 8 : 0;
    } else if (m === "sleepy") {
      // Drowsy cycle (5 s): lids sink, hold shut, then a sluggish half-wake and back.
      const c = u % 5, s = v => v * v * (3 - 2 * v);
      const k = c < 1.2 ? s(c / 1.2) : c < 3.8 ? 1 : 1 - s((c - 3.8) / 1.2);
      eyes = L.eyes * (0.6 + 0.4 * k);
      headX = -4 * k + 3 * s(Math.max(0, 1 - Math.abs(c - 4.5) / 0.5));
      flickN = (c >= 4.3 && c < 4.7) ? Math.sin(Math.PI * (c - 4.3) / 0.4) * 8 : 0;
    }
    const sw = Math.sin(p.walk), cw = Math.cos(p.walk);
    const legA = [0, 0, 0, 0], legK = [0, 0, 0, 0], legLift = [0, 0, 0, 0];
    const ph = [Math.PI, 0, 0, Math.PI], amp = [8, 9, 14, 15];
    for (let i = 0; i < 4; i++) {
      const a = Math.sin(p.walk + ph[i]), c = Math.cos(p.walk + ph[i]), sw2 = Math.max(0, c);
      legA[i] = L.walk * amp[i] * a;
      legK[i] = -L.walk * (i < 2 ? 9 : 22) * sw2;
      legLift[i] = L.walk * 11 * sw2;
      // Paw taps while happy (front legs).
      if (i < 2) { legA[i] += (i === 0 ? 1 : -1) * L.tap * (i === 0 ? Math.max(0, Math.sin(p.tap)) : Math.max(0, -Math.sin(p.tap))); }
      if (S.prev[i] > 0.02 && c <= 0.02 && L.walk > 0.5) S.dust.push({ born: t, i });
      S.prev[i] = c;
    }
    const w2 = Math.sin(2 * p.walk);
    return {
      tail: L.tailBase + L.tailAmp * Math.sin(p.tail) + L.walk * 6 * Math.sin(2 * p.walk + 0.9),
      earN: L.ear + flickN + L.walk * 6 * Math.sin(2 * p.walk - 0.8),
      earF: L.ear + flickF + L.walk * 6 * Math.sin(2 * p.walk - 1.2),
      head: L.head + headX + 1.3 * Math.sin(p.breath * 0.5) + (m === "happy" ? 3 * Math.sin(p.hop) : 0) + L.walk * 2.2 * w2,
      legA, legK, legLift,
      bob: L.walk * 5 * Math.abs(cw) + 0,
      hop: L.hop * Math.abs(Math.sin(p.hop)),
      wiggle: L.wiggle * Math.sin(p.wig),
      crouch: L.crouch,
      breath: L.breath * Math.sin(p.breath),
      eyes: Math.max(eyes, blink),
      mouth: L.mouth, z: L.z, t, u,
    };
  },
  anchors: { nose: [103, 288, 14], eye: [193, 240, 16], collar: [608, 380, 24], tail: [1068, 75, 30] },
  under(c, P, t, api) {
    dirty(c, t);
    const s = 1 - (P.hop + P.bob) / 70;
    c.fillStyle = `rgba(0,0,0,${0.32 * s})`;
    c.beginPath(); c.ellipse(765, 754, 360 * s, 20 * s, 0, 0, 2 * Math.PI); c.fill();
  },
  over(c, P, t, api) {
    dirty(c, t);
    const at = (x, y) => api.point(x, y, P);
    let lid = lidColor(api);
    // Eyelid: fur color sweeping down over the eye, then a closed-eye curve.
    if (P.eyes > 0.02) {
      const [ex, ey] = at(EYE.x, EYE.y), a = EYE.rot + rad(P.head);
      c.save(); c.translate(ex, ey); c.rotate(a);
      c.beginPath(); c.ellipse(0, 0, EYE.rx, EYE.ry, 0, 0, 2 * Math.PI); c.clip();
      const h = 2 * EYE.ry * P.eyes; c.fillStyle = lid; c.fillRect(-EYE.rx - 2, -EYE.ry - 2, 2 * EYE.rx + 4, h + 2);
      c.restore();
      c.save(); c.translate(ex, ey); c.rotate(a);
      const ly = -EYE.ry + h; c.strokeStyle = "rgba(20,16,12,0.95)"; c.lineWidth = 3.4; c.lineCap = "round";
      c.beginPath(); c.moveTo(-EYE.rx + 2, ly - 3); c.quadraticCurveTo(0, ly + 6 * P.eyes, EYE.rx + 4, ly - 2); c.stroke();
      c.restore();
    }
    // Happy open mouth: a dropped jaw with a tongue, drawn under the painted lip line.
    if (P.mouth > 0.05) {
      const m = P.mouth, pts = (arr) => arr.map(([x, y]) => at(x, y));
      const [a, b, cc, d, e] = pts([[152, 327], [217, 334], [209, 350 + 5 * m], [183, 358 + 8 * m], [156, 345 + 4 * m]]);
      c.save(); c.globalAlpha = Math.min(1, m);
      c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.quadraticCurveTo(cc[0] + 4, cc[1] - 2, cc[0], cc[1]);
      c.quadraticCurveTo(d[0], d[1] + 4, e[0], e[1]); c.quadraticCurveTo(e[0] - 4, e[1] - 10, a[0], a[1]); c.closePath();
