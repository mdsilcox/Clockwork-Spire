  "beetle-shell": { c: [730, 525], r: 62, n: 12, dir: -1.57, flap: true },
  "beetle-carapace": { c: [960, 165], r: 88, n: 12, dir: 1.9, flap: true },
};
const NOTCH = {}; for (const id in NOTCH_SPEC) NOTCH[id] = buildNotch(id, NOTCH_SPEC[id]);
const rig0 = {
  size: [1216, 832], grid: [76, 52], pad: [200, 110], anchors: ANCHORS,
  weights(x, y) {
    const head = smooth(310, 265, x) * smooth(300, 345, y);
    const w = {
      head,
      ant: smooth(175, 140, x) * smooth(350, 310, y),
      jaw: smooth(468, 488, y) * smooth(310, 270, x),
      car: smooth(565, 595, x) * smooth(450, 410, y),
      body: smooth(570, 500, y),
      low: smooth(545, 615, y),
      legs: [], lift: [],
    };
    LEGS.forEach(l => {
      const lw = limbW(l.pts, l.hw, 12, x, y) * smooth(l.hip[1] + 25, l.hip[1] + 85, y);
      w.legs.push(lw); w.lift.push(lw * smooth(l.hip[1] + 60, l.hip[1] + 190, y));
    });
    return w;
  },
  deform(x, y, w, P) {
    [x, y] = rot(x, y, ELYTRA[0], ELYTRA[1], rad(P.car), w.car);
    [x, y] = rot(x, y, ANTP[0], ANTP[1], rad(P.ant), w.ant);
    [x, y] = rot(x, y, JAWH[0], JAWH[1], rad(P.jaw), w.jaw);
    [x, y] = rot(x, y, NECK[0], NECK[1], rad(P.head), w.head);
    x += P.hx * w.head;
    LEGS.forEach((l, i) => { [x, y] = rot(x, y, l.hip[0], l.hip[1], rad(P.legs[i]), w.legs[i]); y -= P.lift[i] * w.lift[i]; });
    const b = P.breath * w.body;
    x = 640 + (x - 640) * (1 + 0.3 * b); y = 400 + (y - 400) * (1 + b);
    const k = 1 - P.crouch, drop = (GROUND - 600) * (1 - k), yc = GROUND - (GROUND - y) * k;
    y = y + (yc - y) * w.low + drop * (1 - w.low);
    x += P.dx; y -= P.hop;
    [x, y] = rot(x, y, 640, 600, rad(P.lean), w.body);
    return [x, y];
  },
  moods: { idle: { s: 1 }, attack: { s: 1 }, hurt: { s: 1 }, death: { s: 1 } },
  ease: 40,
  onMood(m, api) { const S = api.state; keepBroken(S); S.start = undefined; S.rng = mulberry(11); S.puffs = []; S.sparks = []; S.cogs = []; S.cyc = -1; S.hit = null; },
  pose(L, t, dt, S, api) {
    keepBroken(S);
    if (S.start === undefined) { S.start = t - dt; S.rng = S.rng || mulberry(11); S.puffs = []; S.sparks = []; S.cogs = []; S.cyc = -1; S.hit = null; }
    const u = t - S.start, now = t, R = S.rng, fx = mkFx(S, R, now), kf = K;
    const P = { head: 0, hx: 0, jaw: 0, ant: 0, car: 0, legs: [0, 0, 0, 0], lift: [0, 0, 0, 0], breath: 0, crouch: 0, dx: 0, hop: 0, lean: 0, flash: 0, glow: 1, dim: 0, shake: null, t };
    const tip = () => api.point(MAND[0] - 20, MAND[1] + 20, api.lastP || P);
    const walk = (fn, f) => { const v = -(fn(u) - fn(u - 0.03)) / 0.03; const [a, l] = gait(LEGS, v, u, f, 240, 0.28, 38); a.forEach((q, i) => P.legs[i] += q); l.forEach((q, i) => P.lift[i] += q); return Math.abs(v); };
    if (api.mood === "idle") {
      // Heavy and patient: a slow breath, the head dips, the jaws part slowly and snap shut, the antenna flicks, the shell vents.
      const x = u % 3;
      P.breath = 0.010 * Math.sin(T2 * u / 1.5); P.crouch = 0.03 + 0.006 * Math.sin(T2 * u / 1.5);
      P.head = -3 * bump(x, 0.6, 1.5) + 2 * bump(x, 1.5, 2.1);
      P.jaw = -9 * kf(x, [[0, 0], [0.7, 0], [1.3, 1], [1.38, 1], [1.45, 0], [3, 0]]);
      P.ant = 14 * cyc(x, 1.8, 2.3, 2);
      P.car = -2 * bump(x, 2.2, 2.7);
      P.legs[1] += 7 * bump(x, 2.2, 2.7); P.lift[1] += 22 * bump(x, 2.2, 2.7);
      P.lean = 1.2 * bump(x, 2.2, 2.7);
      P.glow = 0.75 + 0.15 * Math.sin(T2 * u / 1.5) - 0.5 * kf(x, [[0, 0], [1.9, 0], [1.95, 1], [2.03, 0], [3, 0]]);
      const c = Math.floor((u + 0.5) / 3); if (S.cyc !== c && x > 2.3 && x < 2.6) { S.cyc = c; fx.puffs(VENTS[0], 2, 0.6); }
    } else if (api.mood === "attack") {
      // Rear up with the jaws wide, a heavy lunge with the head leading, jaws slam shut, then lumber back.
      const u2 = u % 2.4;
      const dxF = uu => kf(uu % 2.4, [[0, 0], [0.5, 20], [0.62, 20], [0.78, 34], [0.84, 34], [1.02, -105], [1.3, -105], [2.0, 0], [2.4, 0]]);
      P.dx = dxF(u);
      P.hx = kf(u2 + 0.04, [[0, 0], [0.84, 0], [1.0, -34], [1.1, -12], [1.4, 0], [2.4, 0]]);
      P.head = kf(u2, [[0, 0], [0.45, 18], [0.62, 20], [0.8, 27], [0.84, 27], [0.97, -10], [1.07, -14], [1.4, -4], [1.9, 0], [2.4, 0]]);
      P.jaw = kf(u2, [[0, 0], [0.4, -26], [0.8, -34], [1.02, -28], [1.08, 6], [1.17, 4], [1.6, 0], [2.4, 0]]);
      P.car = kf(u2, [[0, 0], [0.45, -5], [0.84, -8], [1.02, -1], [1.5, 0], [2.4, 0]]);
      P.ant = kf(u2, [[0, 0], [0.5, 12], [1.02, -14], [1.4, 0], [2.4, 0]]);
      P.crouch = kf(u2 - 0.03, [[0, 0], [0.45, 0.12], [0.62, 0.12], [0.8, 0.22], [0.84, 0.22], [1.0, 0.02], [1.4, 0.02], [1.9, 0], [2.4, 0]]);
      P.lean = kf(u2 - 0.04, [[0, 0], [0.45, 4], [0.62, 4], [0.8, 8], [0.84, 8], [1.02, -3], [1.3, -1], [1.9, 0], [2.4, 0]]);
      walk(dxF, 1.7);
      P.legs[0] += -9 * bump(u2, 0.74, 0.98); P.legs[2] += 7 * bump(u2, 0.74, 0.98);  // gather: feet push off
      P.hop = 5 * bump(u2, 0.9, 1.08);
      P.breath = 0.01 * Math.sin(T2 * u / 1.2);
      P.glow = 1 + 0.4 * bump(u2, 0.5, 1.3);
      const sh = u2 > 1.08 ? 6 * Math.exp(-(u2 - 1.08) * 12) : 0;
      if (sh > 0.1) P.shake = [(R() - 0.5) * sh, (R() - 0.5) * sh * 0.6];
      const c = Math.floor(u / 2.4); if (u2 >= 1.08 && S.cyc !== c) { S.cyc = c; fx.sparks(tip(), 12, 380, Math.PI * 0.9); }
    } else if (api.mood === "hurt") {
      // Shoved back on two frames, the head snaps up, the jaws clack, the carapace pops and settles; then a heavy step forward.
      P.flash = u < 0.1 ? 0.2 * (1 - u / 0.1) : 0;
      const dxF = uu => kf(uu - 0.02, [[0, 0], [0.08, 40], [0.45, 40], [1.0, 0], [1.6, 0]]);
      P.dx = dxF(u);
      P.hx = 12 * kf(u, [[0, 0], [0.05, 1], [0.4, 1], [0.9, 0], [1.6, 0]]);
      P.head = kf(u, [[0, 0], [0.06, 18], [0.3, 12], [0.6, -5], [0.9, 0], [1.6, 0]]);
      P.jaw = -16 * Math.exp(-u * 5) * (Math.cos(16 * u) > 0 ? 1 : 0.2);
      P.car = -6 * Math.exp(-3.5 * u) * (0.5 + 0.5 * Math.cos(14 * u));
      P.ant = 20 * Math.exp(-4 * u) * Math.cos(18 * u);
      P.crouch = kf(u - 0.03, [[0, 0], [0.1, 0.08], [0.3, 0.1], [0.7, 0.04], [1.0, 0], [1.6, 0]]);
      P.lean = kf(u - 0.04, [[0, 0], [0.08, 5], [0.4, 3], [0.9, 0], [1.6, 0]]);
      P.hop = 14 * bump(u, 0.02, 0.22);
      walk(dxF, 1.7);
      P.glow = u < 0.4 ? (Math.sin(u * 70) > 0 ? 1 : 0.3) : 0.9;
      P.breath = 0.012 * Math.sin(T2 * u / 1.2);
      const d = Math.exp(-u * 10); P.shake = [(R() - 0.5) * 7 * d, (R() - 0.5) * 4 * d];
      if (!S.hit && u > 0.02) S.hit = { born: now };
    } else if (api.mood === "death") {
      // Shudder, the jaws drop open, the legs buckle outward and the body sinks; the carapace pops up and vents; one leg twitches.
      const uu = Math.min(u, 3);
      const sh = 5 * smooth(0, 0.3, uu) * (1 - smooth(0.9, 1.2, uu));
      P.dx = sh * Math.sin(u * 95); P.hop = sh * 0.5 * Math.abs(Math.sin(u * 60));
      P.crouch = kf(uu - 0.03, [[0, 0], [0.5, 0.04], [1.1, 0.26], [1.7, 0.38], [2.1, 0.42], [3, 0.42]]);
      const sp = kf(uu, [[0, 0], [0.7, 0.3], [1.5, 0.8], [2.1, 1], [3, 1]]);
      P.legs = [22, 14, -16, -26].map(a => a * sp);
      P.lean = kf(uu - 0.05, [[0, 0], [1.2, 0], [2.0, -5], [3, -5]]);
      P.head = kf(uu, [[0, 0], [1.6, 0], [2.4, -12], [3, -12]]);
      P.jaw = kf(uu, [[0, 0], [1.4, 0], [2.0, -26], [3, -26]]);
      P.ant = kf(uu - 0.1, [[0, 0], [1.2, 0], [2.2, 30], [3, 30]]);
      P.car = kf(uu, [[0, 0], [1.0, 0], [1.2, -11], [1.5, -9], [3, -9]]);
      P.lift[1] += 12 * cyc(uu, 2.4, 2.8, 2); P.legs[1] += 7 * cyc(uu, 2.4, 2.8, 2);
      P.glow = uu < 0.9 ? 0.8 * (Math.sin(uu * 40) > 0 ? 1 : 0.2) * (1 - uu / 0.9) : 0;
      P.dim = smooth(0.5, 1.0, uu);
      if (u > 0.05 && u < 1.1) P.shake = [(R() - 0.5) * sh * 0.8, 0];
      if (S.cyc < 0 && u >= 1.15) { S.cyc = 0; for (const s of VENTS) fx.puffs(s, 4, 1.2); fx.puffs([880, 260], 4, 1.4);
        for (let i = 0; i < 6; i++) fx.cog([700 + R() * 260, 230], (R() - 0.5) * 420, -400 - R() * 260, 0.35); }
    }
    P.t = t;
    return P;
  },
  under(c, P, t, api) {
    for (const id of brokenSet(api.state, NOTCH)) notchUnder(c, api, P, t, NOTCH[id]);
    c.fillStyle = "rgba(0,0,0,0.35)"; c.beginPath(); c.ellipse(660, GROUND + 6, 520, 24, 0, 0, 2 * Math.PI); c.fill();
    if (P.dim > 0.01) { c.fillStyle = `rgba(8,12,12,${0.3 * P.dim})`; c.beginPath(); c.ellipse(660, GROUND - 2, 420, 30, 0, 0, 2 * Math.PI); c.fill(); }
  },
  over(c, P, t, api) {
    const S = api.state, at = p => api.point(p[0], p[1], P), bk = keepBroken(S);
    const eyes = at(EYES), alive = 1 - P.dim;
    if (P.dim > 0.01 || P.glow < 0.5) {  // the eye glass dims to a gray-teal, never a black hole
      const d = Math.min(0.85, P.dim * 0.85 + Math.max(0, 0.5 - P.glow) * 0.5);
      c.fillStyle = `rgba(52,78,70,${d})`; c.beginPath(); c.ellipse(eyes[0], eyes[1], 28, 28, 0, 0, 2 * Math.PI); c.fill();
    }
    c.globalCompositeOperation = "lighter";
    glow(c, eyes, 55, [120, 255, 200], 0.2 * Math.max(0, P.glow) * alive);
    glow(c, eyes, 22, [220, 255, 230], 0.25 * Math.max(0, P.glow) * alive);
    c.globalCompositeOperation = "source-over";
    for (const id of brokenSet(S, NOTCH)) { notchErase(c, api, P, rig0, NOTCH[id]); notchOver(c, api, P, t, NOTCH[id], NOTCH_SPEC[id].flap); }
    drawFx(c, S, t, GROUND, at, () => at(CORE));
  },
};

const rig = Rig.mount(document.getElementById("stage"), rig0, IMGSRC);
window.rig = rig;
rig0.onMood("idle", rig);
document.querySelectorAll("button[data-mood]").forEach(b => b.addEventListener("click", () => {
  rig.setMood(b.dataset.mood); document.querySelectorAll("button[data-mood]").forEach(o => o.setAttribute("aria-pressed", o === b));
}));
</script>
